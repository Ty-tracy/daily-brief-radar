name: 每日AI简报

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 判断早晚班并运行
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DAILY_FREQUENCY: ${{ secrets.DAILY_FREQUENCY }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          SEND_TO: ${{ secrets.SEND_TO }}
        run: |
          HOUR_UTC=$(date -u +%H)
          MIN_UTC=$(date -u +%M)
          TOTAL_MIN=$((10#$HOUR_UTC * 60 + 10#$MIN_UTC))

          DIFF_MORNING_1=$(( TOTAL_MIN - 1410 ))
          DIFF_MORNING_2=$(( TOTAL_MIN + 1440 - 1410 ))
          ABS_MORNING_1=${DIFF_MORNING_1#-}
          ABS_MORNING_2=${DIFF_MORNING_2#-}
          if [ "$ABS_MORNING_1" -le "$ABS_MORNING_2" ]; then
            ABS_MORNING=$ABS_MORNING_1
          else
            ABS_MORNING=$ABS_MORNING_2
          fi

          DIFF_EVENING=$(( TOTAL_MIN - 780 ))
          ABS_EVENING=${DIFF_EVENING#-}

          echo "当前 UTC 时间：${HOUR_UTC}:${MIN_UTC}，距早班 ${ABS_MORNING} 分钟，距晚班 ${ABS_EVENING} 分钟"

          if [ "$ABS_MORNING" -le "$ABS_EVENING" ]; then
            echo "========== 开始运行早班（morning） =========="
            python -u run_all.py morning
          else
            echo "========== 开始运行晚班（evening） =========="
            python -u run_all.py evening
          fi

          echo "========== 🔍 检查文件到底生成在哪里了 =========="
          # 在当前目录及所有子目录中寻找 daily_brief.md
          find . -name "daily_brief.md"
