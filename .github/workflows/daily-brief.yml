name: 每日AI简报

on:
  schedule:
    # 注意：GitHub Actions 的 cron 是 UTC 时间，北京时间 = UTC + 8
    # 这里设置：北京时间早上 7:30 (UTC 23:30 前一天) 和 晚上 21:00 (UTC 13:00)
    - cron: '30 23 * * *'   # 北京时间 07:30 早班
    - cron: '0 13 * * *'    # 北京时间 21:00 晚班
  workflow_dispatch:        # 允许你在 GitHub 网页上手动点按钮触发，方便测试

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 判断早晚班并运行
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 👇 新增了微信推送的 Token
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 👇 这里的 Supabase 变量名已经改成和你 Secrets 里一致的
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DAILY_FREQUENCY: ${{ secrets.DAILY_FREQUENCY }}
          # 下面这几个是原来发邮件用的，留着也不影响，以后想发邮件还能用
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          SEND_TO: ${{ secrets.SEND_TO }}
        run: |
          HOUR_UTC=$(date -u +%H)
          MIN_UTC=$(date -u +%M)
          TOTAL_MIN=$((10#$HOUR_UTC * 60 + 10#$MIN_UTC))

          DIFF_MORNING_1=$(( TOTAL_MIN - 1410 ))
          DIFF_MORNING_2=$(( TOTAL_MIN + 1440 - 1410 ))
          ABS_MORNING_1=${DIFF_MORNING_1#-}
          ABS_MORNING_2=${DIFF_MORNING_2#-}
          if [ "$ABS_MORNING_1" -le "$ABS_MORNING_2" ]; then
            ABS_MORNING=$ABS_MORNING_1
          else
            ABS_MORNING=$ABS_MORNING_2
          fi

          DIFF_EVENING=$(( TOTAL_MIN - 780 ))
          ABS_EVENING=${DIFF_EVENING#-}

          echo "当前 UTC 时间：${HOUR_UTC}:${MIN_UTC}，距早班 ${ABS_MORNING} 分钟，距晚班 ${ABS_EVENING} 分钟"

          if [ "$ABS_MORNING" -le "$ABS_EVENING" ]; then
            echo "判定为：早班（morning）"
            python run_all.py morning
          else
            echo "判定为：晚班（evening）"
            python run_all.py evening
          fi
